<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>South Tennis</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#C8201A;--red-d:#9B1512;--bg:#F5F4F2;--surface:#fff;--surface2:#F8F8F8;--border:#E8E8E8;--txt:#1A1A1A;--txt2:#666;--sidebar-w:200px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--txt);background:var(--bg)}
/* LAYOUT */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:0 1rem;height:52px;background:#111;flex-shrink:0}
.body{display:flex;flex:1;overflow:hidden}
/* SIDEBAR — desktop */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:#1A1A1A;overflow-y:auto;flex-shrink:0}
.ns{padding:8px 14px 3px;font-size:10px;font-weight:700;color:#555;letter-spacing:1.5px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;font-size:13px;color:#777;border-left:3px solid transparent;background:none;border-right:none;border-top:none;border-bottom:none;width:100%;text-align:left;font-family:inherit}
.ni:hover{color:#fff;background:rgba(255,255,255,.05)}
.ni.ac{color:#fff;border-left-color:var(--red);background:rgba(200,32,26,.15)}
/* MAIN */
.main{flex:1;overflow-y:auto;padding:1.25rem}
/* BOTTOM NAV — mobile only */
.bottom-nav{display:none;background:#111;border-top:1px solid #333;flex-shrink:0}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 4px;cursor:pointer;color:#666;font-size:10px;gap:2px;min-height:54px;border:none;background:transparent;font-family:inherit}
.bn-item i{font-size:22px}
.bn-item.ac{color:var(--red)}
.more-menu{background:#1A1A1A;border-top:1px solid #333}
.mm-item{display:flex;align-items:center;gap:12px;padding:12px 1.25rem;color:#aaa;cursor:pointer;font-size:13px;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.mm-item:hover,.mm-item:active{background:rgba(255,255,255,.05);color:#fff}
.mm-item.ac{color:#fff;background:rgba(200,32,26,.15)}
.mm-item i{font-size:18px}
/* RESPONSIVE */
@media(max-width:700px){
  .sidebar{display:none}
  .bottom-nav{display:flex}
  .main{padding:.75rem}
}
/* COMMON */
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--txt);font-size:13px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--txt);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;min-height:38px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn:active{opacity:.85}
.btn-r{background:var(--red);border-color:var(--red);color:#fff}
.btn-r:hover{background:var(--red-d)}
.btn-g{background:#1F5014;border-color:#1F5014;color:#fff}
.btn-b{background:#0C447C;border-color:#0C447C;color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;min-height:32px}
.btn-full{width:100%}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.ba{background:var(--red);color:#fff}.bv{background:#333;color:#ccc}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem;margin-bottom:.9rem}
.ct{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.75rem}
.met{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:.9rem}
.mc2{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.8rem;text-align:center}
.ml{font-size:11px;color:#aaa;margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.mv{font-size:17px;font-weight:600}
.mv.r{color:var(--red)}.mv.g{color:#1F5014}.mv.b{color:#0C447C}
.frow{margin-bottom:.75rem}
.frow label{display:block;font-size:11px;color:#aaa;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase}
.tbl td{padding:8px 10px;border-bottom:1px solid #F7F7F7}
.tbl tr:last-child td{border:none}
.tbl tr:hover td{background:#FAFAFA}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.td{background:#FBEAF0;color:#993556}.tc{background:#E6F1FB;color:#185FA5}.tm{background:#EAF3DE;color:#3B6D11}
.tag-ini{background:#FFF3E0;color:#E65100}.tag-nvo{background:#EAF3DE;color:#1B5E20}
.caja-live{background:linear-gradient(135deg,#1A1A1A,#2A2A2A);border-radius:12px;padding:1.25rem;margin-bottom:.9rem;color:#fff}
.clg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.cli{text-align:center;padding:.65rem;background:rgba(255,255,255,.05);border-radius:8px}
.cll{font-size:11px;color:#888;margin-bottom:3px}
.clv{font-size:18px;font-weight:600}
.pw{height:7px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:6px 0}
.pf{height:100%;border-radius:99px}
.ebox{padding:10px;border-radius:8px;font-weight:600;font-size:13px;text-align:center;margin-top:8px}
.ep{background:#EAF5E3;color:#1F5014;border:1px solid #B0D9A0}
.en{background:#FDECEA;color:#9B1512;border:1px solid #F5BABA}
.dz{border:1.5px solid #F5BABA;border-radius:10px;padding:.9rem;background:#FFFAFA;margin-bottom:.5rem}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;padding:3rem;color:#aaa;gap:8px;font-size:13px}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
/* ESTADOS */
.estado-h{background:#1A1A1A;color:#fff;padding:11px 16px;border-radius:10px 10px 0 0;font-weight:600;font-size:13px}
.estado-b{border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;overflow:hidden;margin-bottom:.9rem}
.er{display:flex;justify-content:space-between;padding:9px 16px;border-bottom:1px solid #F5F5F5;font-size:13px}
.er:last-child{border:none}
.er.tot{background:#F5F4F2;font-weight:700;font-size:14px}
.er.sub{background:#FAFAFA;font-weight:600}
.er.sec{background:#F0F0F0;font-weight:700;font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.5px}
.er.pos{color:#1F5014}.er.neg{color:var(--red)}
/* TALLA BTNS */
.tb-wrap{display:flex;flex-wrap:wrap;gap:8px}
.tb{padding:8px 14px;border:2px solid var(--border);border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;background:var(--surface);color:var(--txt);min-width:48px;min-height:42px;display:flex;align-items:center;justify-content:center;font-family:inherit}
.tb.ac{border-color:var(--red);background:var(--red);color:#fff}
/* ZAPATOS GRID */
.zg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.zc{border:2px solid var(--border);border-radius:10px;padding:.85rem;cursor:pointer;background:var(--surface);transition:border-color .15s}
.zc:hover{border-color:var(--red);background:#FFF5F5}
.zc.sel{border-color:var(--red);background:#FFF0F0;box-shadow:0 0 0 3px rgba(200,32,26,.12)}
/* SOCIO CARD */
.sc{border:1px solid var(--border);border-radius:12px;padding:1rem;background:var(--surface);margin-bottom:.75rem;position:relative}
.sc-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:.75rem}
.ss{background:var(--surface2);border-radius:8px;padding:.65rem;text-align:center}
.ss-l{font-size:11px;color:#aaa;margin-bottom:2px}
.ss-v{font-size:14px;font-weight:600}
/* INV CARDS */
.inv-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.85rem;margin-bottom:.6rem}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.pt{font-size:19px;font-weight:600}
@media(max-width:700px){
  .met{grid-template-columns:repeat(2,minmax(0,1fr))}
  .zg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr 1fr}
  .ph{margin-bottom:.75rem}
  .pt{font-size:17px}
}
</style>
</head>

function parseFecha(f){
  if(!f)return null;
  // Si es formato ISO yyyy-mm-dd
  if(f.includes('-')&&f.length===10)return new Date(f+'T00:00:00');
  // Si es formato colombiano d/m/yyyy
  const p=f.split('/');if(p.length===3)return new Date(`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}T00:00:00`);
  return new Date(f);
}
function calcSaldos(){
  const be=S.cfg.saldo_efectivo||0,bb=S.cfg.saldo_banco||0,fb=S.cfg.fecha_saldo||'';
  let ef=be,ban=bb;
  const fechaBase=fb?parseFecha(fb):null;
  S.caja.forEach(r=>{
    if(fechaBase){
      const fechaMov=parseFecha(r.fecha);
      if(fechaMov&&fechaMov<=fechaBase)return;
    }
    const fp=r.forma_pago||'Efectivo';const add=r.tipo!=='Gasto';
    if(fp==='Efectivo')ef+=add?r.monto:-r.monto;else ban+=add?r.monto:-r.monto;
  });
  return{ef,ban,total:ef+ban};
}
const tgf=()=>S.cfg.gastos_fijos.reduce((a,b)=>a+(b.monto||0),0);
const paresV=()=>S.ventas.reduce((a,b)=>a+(b.cant||0),0);
const capitalSocios=()=>S.socios.reduce((a,s)=>a+(s.aporte_efectivo||0)+(s.aporte_inventario||0),0);
const invInicial=()=>S.inventario.filter(r=>r.origen==='inicial');
const invNuevo=()=>S.inventario.filter(r=>r.origen!=='inicial');
const valInv=(arr)=>arr.reduce((a,b)=>a+(b.cant*(b.pc||0)),0);

async function cargar(p){
  const full=['dashboard','finanzas','contabilidad-er','contabilidad-bg','contabilidad-fe','socios'];
  if(full.includes(p)){
    const[inv,ven,ped,caj,cfg,com,soc]=await Promise.all([
      dbGet('inventario','?order=talla,nombre'),dbGet('ventas','?order=id.desc'),
      dbGet('pedidos','?order=id.desc'),dbGet('caja','?order=id.desc'),
      dbGet('config','?limit=1'),dbGet('comisiones','?order=id.desc'),
      dbGet('socios','?order=id'),
    ]);
    S.inventario=inv||[];S.ventas=ven||[];S.pedidos=ped||[];S.caja=caj||[];S.comisiones=com||[];S.socios=soc||[];
    if(cfg&&cfg[0])S.cfg={...S.cfg,...cfg[0]};
  }else if(p==='inventario')S.inventario=await dbGet('inventario','?order=talla,nombre')||[];
  else if(p==='vender'){S.inventario=await dbGet('inventario','?cant=gt.0&order=talla,nombre')||[];S.vTalla=null;S.vProd=null;}
  else if(p==='pedidos')S.pedidos=await dbGet('pedidos','?order=id.desc')||[];
  else if(p==='caja'){S.caja=await dbGet('caja','?order=id.desc')||[];const c=await dbGet('config','?limit=1');if(c&&c[0])S.cfg={...S.cfg,...c[0]};}
  else if(p==='creditos'){S.creditos=await dbGet('creditos','?order=id.desc')||[];}
  else if(p==='nomina'){S.nomina=await dbGet('nomina','?order=id.desc')||[];S.comisiones=await dbGet('comisiones','?order=id.desc')||[];}
  else if(p==='cierres'){S.cierres=await dbGet('cierres_mes','?order=id.desc')||[];}
  else if(p==='pedidos-proveedor'){S.pedidosProv=await dbGet('pedidos_proveedor','?order=id.desc')||[];S.inventario=await dbGet('inventario','?order=talla,nombre')||[];S.stockMin=await dbGet('stock_minimo','?order=ref')||[];}
  else if(p==='comisiones')S.comisiones=await dbGet('comisiones','?order=id.desc')||[];
  else if(p==='empaques')S.empaques=await dbGet('empaques','?order=id')||[];
  else if(p==='ajustes'){const c=await dbGet('config','?limit=1');if(c&&c[0])S.cfg={...S.cfg,...c[0]};}
}

async function goTo(p){

  document.querySelectorAll('.ni').forEach(el=>el.classList.toggle('ac',el.dataset.page===p));

    dbPost('ventas',{fecha:hoy(),vendedor:S.session.usuario,cliente,ref:pSel.nombre,talla,cant,precio_unit:pu,total,forma_pago:pago,tipo_venta:tipo,domicilio:dom,descuento:'No'}),

    <button class="btn btn-r btn-sm" onclick="goTo('vender')"><i class="ti ti-plus"></i> Nueva</button>
  </div>`;

}

/* INVENTARIO */
function filtrarInv(){
  const t=document.getElementById('inv-t')?.value.trim()||'';
  const g=document.getElementById('inv-g')?.value||'';
  const o=document.getElementById('inv-o')?.value||'';
  let rows=S.inventario;
  // Solo filtra por stock cuando se busca una talla específica
  if(t){rows=rows.filter(r=>r.talla===parseInt(t)&&r.cant>0);}
  if(g)rows=rows.filter(r=>r.genero===g);
  if(o)rows=rows.filter(r=>(r.origen||'nuevo')===o);
  const tb=document.getElementById('inv-tabla');
  if(tb)tb.innerHTML=tablaInv(rows);
  const cnt=document.getElementById('inv-cnt');
  if(cnt)cnt.textContent=rows.reduce((a,b)=>a+b.cant,0)+' uds';
}

      </tr></thead>

        </tr>`;

}

function sCalc(){const ef=parseInt(document.getElementById('s-ef')?.value)||0;const inv=parseInt(document.getElementById('s-inv')?.value)||0;const el=document.getElementById('s-tot');if(el)el.textContent=fmt(ef+inv);}
async function regSocio(){
  const nom=document.getElementById('s-nom').value.trim();const fecha=document.getElementById('s-fecha').value;
  const ef=parseInt(document.getElementById('s-ef').value)||0;const inv=parseInt(document.getElementById('s-inv').value)||0;
  const notas=document.getElementById('s-notas').value.trim();
  if(!nom){toast('Ingresa el nombre',false);return;}
  await dbPost('socios',{nombre:nom,fecha_ingreso:fecha,aporte_efectivo:ef,aporte_inventario:inv,notas});
  if(ef>0)await dbPost('caja',{fecha:hoy(),tipo:'Aporte Capital',descripcion:`Aporte de ${nom}`,monto:ef,forma_pago:'Transferencia'});
  const cs=[...(S.cfg.capital_social||[]),{nombre:nom,fecha,efectivo:ef,inventario:inv}];
  await dbPatch('config',{capital_social:cs},`?id=eq.${S.cfg.id}`);
  toast('Socio registrado ✓');goTo('socios');
}

function pgFE(){

  return`<div class="ph"><h2 class="pt"><i class="ti ti-arrows-exchange" style="color:var(--red)"></i> Flujo de Efectivo</h2></div>

async function cierreMes(){
  if(!confirm('¿Cerrar el mes?\n\nEsto guardará el resumen, reiniciará ventas y gastos a 0, y usará el saldo actual como base del nuevo mes.\n\nEl inventario, pedidos y créditos se mantienen.'))return;
  // Cargar datos actuales
  const[ventas,comisiones,caja,inventario,cfg]=await Promise.all([
    dbGet('ventas','?order=id'),dbGet('comisiones','?order=id'),
    dbGet('caja','?order=id'),dbGet('inventario','?order=id'),
    dbGet('config','?limit=1'),
  ]);
  const cfgData=cfg&&cfg[0]?cfg[0]:S.cfg;
  // Calcular saldo actual real
  const fb=cfgData.fecha_saldo||'';
  let ef=cfgData.saldo_efectivo||0,ban=cfgData.saldo_banco||0;
  (caja||[]).forEach(r=>{
    if(fb&&r.fecha<=fb)return;
    const fp=r.forma_pago||'Efectivo';const add=r.tipo!=='Gasto';
    if(fp==='Efectivo')ef+=add?r.monto:-r.monto;else ban+=add?r.monto:-r.monto;
  });
  // Calcular métricas del mes
  const totalVentas=(ventas||[]).reduce((a,b)=>a+(b.total||0),0);
  const totalPares=(ventas||[]).reduce((a,b)=>a+(b.cant||0),0);
  const totalGastos=(caja||[]).filter(r=>r.tipo==='Gasto').reduce((a,b)=>a+(b.monto||0),0);
  const totalComisiones=(comisiones||[]).reduce((a,b)=>a+(b.bono||0),0);
  let costoVendido=0;
  (ventas||[]).forEach(v=>{
    const p=(inventario||[]).find(r=>r.nombre===v.ref&&r.talla===v.talla);
    costoVendido+=(p?p.pc||0:0)*(v.cant||0);
  });
  const utilBruta=totalVentas-costoVendido;
  const utilNeta=utilBruta-totalGastos;
  const mes=new Date().toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  const fechaHoy=hoy();
  // 1. Guardar cierre
  await dbPost('cierres_mes',{
    fecha:fechaHoy,mes,
    total_ventas:totalVentas,total_pares:totalPares,
    total_gastos:totalGastos,utilidad_bruta:utilBruta,
    utilidad_neta:utilNeta,total_comisiones:totalComisiones,
    resumen:{saldo_efectivo:ef,saldo_banco:ban,ventas_count:(ventas||[]).length}
  });
  // 2. Actualizar saldo base con el saldo final del mes
  const fechaISO=new Date().toISOString().split('T')[0];
  await dbPatch('config',{saldo_efectivo:Math.round(ef),saldo_banco:Math.round(ban),fecha_saldo:fechaISO},`?id=eq.${cfgData.id}`);
  S.cfg.saldo_efectivo=Math.round(ef);S.cfg.saldo_banco=Math.round(ban);S.cfg.fecha_saldo=fechaISO;
  // 3. Limpiar ventas, comisiones y movimientos de caja
  await Promise.all([
    dbDel('ventas','?id=gt.0'),
    dbDel('comisiones','?id=gt.0'),
    dbDel('caja','?id=gt.0'),
  ]);
  toast('Mes cerrado ✓ Saldo base actualizado a '+fmt(ef+ban));goTo('ajustes');
}

function crCalc(){
  const prec=parseInt(document.getElementById('cr-prec')?.value)||0;
  const abon=parseInt(document.getElementById('cr-abon')?.value)||0;
  const cuotas=parseInt(document.getElementById('cr-cuotas')?.value)||1;
  const saldo=Math.max(0,prec-abon);
  const vcuota=cuotas>0?Math.ceil(saldo/cuotas):saldo;
  const es=document.getElementById('cr-saldo');const ev=document.getElementById('cr-vcuota');
  if(es)es.textContent=fmt(saldo);if(ev)ev.textContent=fmt(vcuota);
}
async function regCredito(){
  const cli=document.getElementById('cr-cli').value.trim();
  const tel=document.getElementById('cr-tel').value.trim();
  const ref=document.getElementById('cr-ref').value.trim().toUpperCase();
  const talla=parseInt(document.getElementById('cr-tall').value)||0;
  const cant=parseInt(document.getElementById('cr-cant').value)||1;
  const precio=parseInt(document.getElementById('cr-prec').value)||0;
  const abono=parseInt(document.getElementById('cr-abon').value)||0;
  const cuotas=parseInt(document.getElementById('cr-cuotas').value)||1;
  const pago=document.getElementById('cr-pago').value;
  const notas=document.getElementById('cr-notas').value.trim();
  if(!cli||!ref){toast('Completa cliente y referencia',false);return;}
  const saldo=Math.max(0,precio-abono);
  const vcuota=Math.ceil(saldo/cuotas);
  await dbPost('creditos',{fecha:hoy(),vendedor:S.session.usuario,cliente:cli,telefono:tel,ref,talla,cant,precio_total:precio,abono_inicial:abono,saldo,num_cuotas:cuotas,valor_cuota:vcuota,cuotas_pagadas:0,forma_pago:pago,notas,estado:'Pendiente'});
  if(abono>0)await dbPost('caja',{fecha:hoy(),tipo:'Cobro Crédito',descripcion:`Abono inicial ${cli} — ${ref}`,monto:abono,forma_pago:pago});
  toast('Crédito registrado ✓');goTo('creditos');
}
async function abonarCredito(id,saldoAct,vcuota){
  const c=(S.creditos||[]).find(x=>x.id===id);if(!c)return;
  const monto=Math.min(vcuota,saldoAct);
  if(!confirm(`Registrar cuota de ${fmt(monto)}?\nSaldo restante: ${fmt(saldoAct-monto)}`))return;
  const nuevoSaldo=Math.max(0,saldoAct-monto);
  const cpagadas=(c.cuotas_pagadas||0)+1;
  const estado=nuevoSaldo<=0?'Pagado':'Pendiente';
  await Promise.all([
    dbPatch('creditos',{saldo:nuevoSaldo,cuotas_pagadas:cpagadas,estado},`?id=eq.${id}`),
    dbPost('caja',{fecha:hoy(),tipo:'Cobro Crédito',descripcion:`Cuota ${cpagadas} — ${c.cliente} ${c.ref}`,monto,forma_pago:c.forma_pago}),
  ]);
  toast('Cuota registrada ✓');goTo('creditos');
}
async function abonarCreditoLibre(id,saldoAct){
  const c=(S.creditos||[]).find(x=>x.id===id);if(!c)return;
  const monto=parseInt(prompt(`Abono libre a ${c.cliente}\nSaldo: ${fmt(saldoAct)}\nIngresa el monto:`));

  const nuevoSaldo=Math.max(0,saldoAct-monto);

}

  ${(S.stockMin||[]).length===0?`<div style="color:#bbb;font-size:13px">Sin mínimos definidos — se usa 1 ud por defecto</div>`:`
  <table class="tbl"><thead><tr><th>Referencia</th><th>Talla</th><th>Mínimo</th>${isAdmin()?'<th></th>':''}</tr></thead><tbody>
  ${(S.stockMin||[]).map(m=>`<tr><td style="font-weight:600">${m.ref}</td><td>T${m.talla}</td><td>${m.stock_minimo} uds</td>
  ${isAdmin()?`<td><button class="btn btn-sm" onclick="delMin(${m.id})" style="color:var(--red);border-color:#F5BABA;padding:4px 7px"><i class="ti ti-trash"></i></button></td>`:''}</tr>`).join('')}
  </tbody></table>`}
  </div>`;
}
function ppCalc(){const c=parseInt(document.getElementById('pp-cant')?.value)||0;const p=parseInt(document.getElementById('pp-precio')?.value)||0;const el=document.getElementById('pp-total');if(el)el.textContent=fmt(c*p);}
async function regPedidoProv(){
  const prov=document.getElementById('pp-prov').value.trim();
  const ref=document.getElementById('pp-ref').value.trim().toUpperCase();
  const talla=parseInt(document.getElementById('pp-talla').value)||0;
  const gen=document.getElementById('pp-gen').value;
  const cant=parseInt(document.getElementById('pp-cant').value)||1;
  const precio=parseInt(document.getElementById('pp-precio').value)||0;
  const fecha_entrega=document.getElementById('pp-fecha').value;
  const notas=document.getElementById('pp-notas').value.trim();
  if(!ref){toast('Ingresa la referencia',false);return;}
  await dbPost('pedidos_proveedor',{fecha:hoy(),proveedor:prov,ref,talla,genero:gen,cant,precio_compra:precio,total:cant*precio,estado:'Pendiente',fecha_entrega:fecha_entrega||'Por confirmar',notas});
  toast('Pedido registrado ✓');goTo('pedidos-proveedor');
}
async function recibirPedidoProv(id){
  const p=(S.pedidosProv||[]).find(x=>x.id===id);if(!p)return;
  if(!confirm(`¿Marcar recibido?\nSe agregarán ${p.cant} uds de ${p.ref} T${p.talla} al inventario.`))return;
  const exist=await dbGet('inventario',`?nombre=eq.${encodeURIComponent(p.ref)}&talla=eq.${p.talla}`);
  if(exist&&exist[0]){await dbPatch('inventario',{cant:exist[0].cant+p.cant},`?id=eq.${exist[0].id}`);}
  else{await dbPost('inventario',{nombre:p.ref,talla:p.talla,genero:p.genero||'MIXTO',cant:p.cant,precio:0,pc:p.precio_compra,origen:'nuevo'});}
  await dbPatch('pedidos_proveedor',{estado:'Recibido'},`?id=eq.${id}`);
  await dbPost('caja',{fecha:hoy(),tipo:'Gasto',descripcion:`Compra: ${p.ref} T${p.talla} x${p.cant}`,monto:p.total,forma_pago:'Transferencia'});
  toast('Recibido · inventario actualizado ✓');goTo('pedidos-proveedor');
}
async function delPedidoProv(id){if(!confirm('¿Eliminar?'))return;await dbDel('pedidos_proveedor',`?id=eq.${id}`);toast('Eliminado');goTo('pedidos-proveedor');}
function showAddMin(){document.getElementById('min-form').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:.75rem;align-items:flex-end">
  <div><div style="font-size:11px;color:#aaa;margin-bottom:3px">Referencia</div><input id="mn-ref" placeholder="SAMBA"/></div>
  <div><div style="font-size:11px;color:#aaa;margin-bottom:3px">Talla</div><input id="mn-t" type="number" value="40"/></div>
  <div><div style="font-size:11px;color:#aaa;margin-bottom:3px">Mínimo uds</div><input id="mn-m" type="number" value="2"/></div>
  <button class="btn btn-g btn-sm" onclick="saveMin()"><i class="ti ti-check"></i></button>
</div>`;}
async function saveMin(){
  const ref=document.getElementById('mn-ref').value.trim().toUpperCase();
  const t=parseInt(document.getElementById('mn-t').value)||0;
  const m=parseInt(document.getElementById('mn-m').value)||1;
  if(!ref||!t){toast('Completa referencia y talla',false);return;}
  await dbPost('stock_minimo',{ref,talla:t,genero:'',stock_minimo:m});
  toast('Guardado ✓');goTo('pedidos-proveedor');
}
async function delMin(id){if(!confirm('¿Eliminar?'))return;await dbDel('stock_minimo',`?id=eq.${id}`);toast('Eliminado');goTo('pedidos-proveedor');}
async function autoOrden(){
  const alertas=(S.inventario||[]).filter(r=>{const min=(S.stockMin||[]).find(m=>m.ref===r.nombre&&m.talla===r.talla);return min?r.cant<=min.stock_minimo:r.cant<=1;});
  if(!alertas.length){toast('Sin productos para pedir',false);return;}
  if(!confirm(`¿Crear ${alertas.length} pedido(s) automático(s)?`))return;
  for(const r of alertas){
    const min=(S.stockMin||[]).find(m=>m.ref===r.nombre&&m.talla===r.talla);
    const cantPedir=min?Math.max(1,min.stock_minimo*2-r.cant):3;
    await dbPost('pedidos_proveedor',{fecha:hoy(),proveedor:'Por definir',ref:r.nombre,talla:r.talla,genero:r.genero,cant:cantPedir,precio_compra:r.pc||0,total:cantPedir*(r.pc||0),estado:'Pendiente',fecha_entrega:'Por confirmar',notas:'Generado automáticamente'});
  }
  toast(`${alertas.length} pedido(s) creados ✓`);goTo('pedidos-proveedor');
}

/* ══ NÓMINA ══ */
function pgNomina(){
  const pend=(S.nomina||[]).filter(n=>n.estado==='Pendiente');
  const pag=(S.nomina||[]).filter(n=>n.estado==='Pagado');
  const totalPend=pend.reduce((a,n)=>a+(n.total||0),0);
  const comisionesPeriodo=(S.comisiones||[]).reduce((a,c)=>a+(c.bono||0),0);
  const hoyDate=new Date();
  const mes=hoyDate.getMonth();const anio=hoyDate.getFullYear();const dia=hoyDate.getDate();
  const inicioQ=`${anio}-${String(mes+1).padStart(2,'0')}-${dia<=15?'01':'16'}`;
  const salarioBase=15*20000;
  return`<div class="ph"><h2 class="pt"><i class="ti ti-users" style="color:var(--red)"></i> Nómina</h2></div>
  <div class="met">
    <div class="mc2"><div class="ml">Por pagar</div><div class="mv r" style="font-size:14px">${fmt(totalPend)}</div></div>
    <div class="mc2"><div class="ml">Pagos realizados</div><div class="mv g">${pag.length}</div></div>
    <div class="mc2"><div class="ml">Comisiones acum.</div><div class="mv b" style="font-size:14px">${fmt(comisionesPeriodo)}</div></div>
    <div class="mc2"><div class="ml">Valor día</div><div class="mv">$20.000</div></div>
  </div>
  <div class="card" style="border:2px solid #1F5014"><div class="ct" style="color:#1F5014">Liquidar quincena — Ismael</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px">
      <div class="frow"><label>Empleado</label><input id="nm-emp" value="Ismael"/></div>
      <div class="frow"><label>Período inicio</label><input id="nm-ini" type="date" value="${inicioQ}"/></div>
      <div class="frow"><label>Período fin</label><input id="nm-fin" type="date"/></div>
      <div class="frow"><label>Días trabajados</label><input id="nm-dias" type="number" value="15" min="1" max="31" oninput="nmCalc()"/></div>
      <div class="frow"><label>Valor por día</label><input id="nm-vdia" type="number" value="20000" oninput="nmCalc()"/></div>
      <div class="frow"><label>Comisiones</label><input id="nm-com" type="number" value="${comisionesPeriodo}" oninput="nmCalc()"/></div>
      <div class="frow"><label>Deducciones</label><input id="nm-ded" type="number" value="0" oninput="nmCalc()"/></div>
      <div class="frow"><label>Forma de pago</label><select id="nm-pago"><option>Efectivo</option><option>Transferencia</option><option>Bancolombia</option></select></div>
      <div class="frow"><label>Notas</label><input id="nm-notas" placeholder="Observaciones..."/></div>
    </div>
    <div style="background:#EAF5E3;border-radius:10px;padding:12px;margin:.75rem 0;display:flex;gap:20px;flex-wrap:wrap;border:1px solid #B0D9A0">
      <div><div style="font-size:11px;color:#aaa">Salario base</div><div id="nm-base" style="font-size:17px;font-weight:700;color:#1F5014">${fmt(salarioBase)}</div></div>
      <div><div style="font-size:11px;color:#aaa">+ Comisiones</div><div id="nm-cshow" style="font-size:17px;font-weight:700;color:#0C447C">${fmt(comisionesPeriodo)}</div></div>
      <div><div style="font-size:11px;color:#aaa">− Deducciones</div><div id="nm-dshow" style="font-size:17px;font-weight:700;color:var(--red)">${fmt(0)}</div></div>
      <div><div style="font-size:11px;color:#aaa">TOTAL A PAGAR</div><div id="nm-total" style="font-size:22px;font-weight:700;color:#1A1A1A">${fmt(salarioBase+comisionesPeriodo)}</div></div>
    </div>
    <button class="btn btn-g" onclick="regNomina()"><i class="ti ti-cash"></i> Liquidar quincena</button>
  </div>
  ${pend.length?`<div class="card"><div class="ct" style="display:flex;justify-content:space-between">Pendientes <span style="color:var(--red)">${fmt(totalPend)}</span></div>
  ${pend.map(n=>`<div style="border:1px solid #F0F0F0;border-radius:10px;padding:.85rem;margin-bottom:.6rem">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
      <div><div style="font-weight:700;font-size:14px">${n.empleado}</div>
      <div style="font-size:12px;color:#aaa">Período: ${n.periodo_inicio||'—'} → ${n.periodo_fin||'—'}</div>
      <div style="font-size:12px;color:#aaa">${n.dias_trabajados} días · $${(n.valor_dia||20000).toLocaleString('es-CO')}/día</div>
      ${n.notas?`<div style="font-size:11px;color:#aaa">${n.notas}</div>`:''}
      </div>
      <div style="text-align:right"><div style="font-size:20px;font-weight:700;color:#1F5014">${fmt(n.total)}</div><div style="font-size:11px;color:#aaa">a pagar</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;margin-bottom:8px">
      <div style="background:#F5F4F2;border-radius:6px;padding:6px;text-align:center"><div style="color:#aaa;font-size:10px">Salario base</div><div style="font-weight:600">${fmt(n.salario_base)}</div></div>
      <div style="background:#F5F4F2;border-radius:6px;padding:6px;text-align:center"><div style="color:#aaa;font-size:10px">Comisiones</div><div style="font-weight:600;color:#0C447C">${fmt(n.comisiones)}</div></div>
      <div style="background:#F5F4F2;border-radius:6px;padding:6px;text-align:center"><div style="color:#aaa;font-size:10px">Deducciones</div><div style="font-weight:600;color:var(--red)">${fmt(n.deducciones)}</div></div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-g btn-sm" onclick="pagarNomina(${n.id},${n.total},'${n.empleado}','${n.forma_pago||'Efectivo'}')"><i class="ti ti-cash"></i> Confirmar pago</button>
      ${isAdmin()?`<button class="btn btn-sm" onclick="delNomina(${n.id})" style="color:var(--red);border-color:#F5BABA"><i class="ti ti-trash"></i></button>`:''}
    </div>
  </div>`).join('')}</div>`:''}
  ${pag.length?`<div class="card"><div class="ct">Historial de pagos (${pag.length})</div>
  <table class="tbl"><thead><tr><th>Empleado</th><th>Período</th><th>Base</th><th>Comisiones</th><th>Total</th><th>Fecha</th>${isAdmin()?'<th></th>':''}</tr></thead><tbody>
  ${pag.map(n=>`<tr><td style="font-weight:600">${n.empleado}</td><td style="font-size:12px;color:#aaa">${n.periodo_inicio||'—'} → ${n.periodo_fin||'—'}</td><td>${fmt(n.salario_base)}</td><td style="color:#0C447C;font-weight:600">${fmt(n.comisiones)}</td><td style="color:#1F5014;font-weight:700">${fmt(n.total)}</td><td style="color:#aaa;font-size:12px">${n.fecha}</td>
  ${isAdmin()?`<td><button class="btn btn-sm" onclick="delNomina(${n.id})" style="color:var(--red);border-color:#F5BABA;padding:4px 7px"><i class="ti ti-trash"></i></button></td>`:''}</tr>`).join('')}
  </tbody></table></div>`:''}`;
}
function nmCalc(){
  const dias=parseInt(document.getElementById('nm-dias')?.value)||0;
  const vdia=parseInt(document.getElementById('nm-vdia')?.value)||0;
  const com=parseInt(document.getElementById('nm-com')?.value)||0;
  const ded=parseInt(document.getElementById('nm-ded')?.value)||0;
  const base=dias*vdia;const total=Math.max(0,base+com-ded);
  const eb=document.getElementById('nm-base');const ec=document.getElementById('nm-cshow');
  const ed=document.getElementById('nm-dshow');const et=document.getElementById('nm-total');
  if(eb)eb.textContent=fmt(base);if(ec)ec.textContent=fmt(com);
  if(ed)ed.textContent=fmt(ded);if(et)et.textContent=fmt(total);
}
async function regNomina(){
  const emp=document.getElementById('nm-emp').value.trim();
  const ini=document.getElementById('nm-ini').value;
  const fin=document.getElementById('nm-fin').value;
  const dias=parseInt(document.getElementById('nm-dias').value)||15;
  const vdia=parseInt(document.getElementById('nm-vdia').value)||20000;
  const com=parseInt(document.getElementById('nm-com').value)||0;
  const ded=parseInt(document.getElementById('nm-ded').value)||0;
  const pago=document.getElementById('nm-pago').value;
  const notas=document.getElementById('nm-notas').value.trim();
  if(!emp){toast('Ingresa el nombre del empleado',false);return;}
  if(!fin){toast('Selecciona la fecha fin del período',false);return;}
  const base=dias*vdia;const total=Math.max(0,base+com-ded);
  await dbPost('nomina',{fecha:hoy(),empleado:emp,periodo_inicio:ini,periodo_fin:fin,dias_trabajados:dias,valor_dia:vdia,salario_base:base,comisiones:com,deducciones:ded,total,forma_pago:pago,notas,estado:'Pendiente'});
  toast('Nómina liquidada ✓');goTo('nomina');
}
async function pagarNomina(id,total,emp,pago){
  if(!confirm(`¿Confirmar pago de ${fmt(total)} a ${emp}?`))return;
  await Promise.all([
    dbPatch('nomina',{estado:'Pagado'},`?id=eq.${id}`),
    dbPost('caja',{fecha:hoy(),tipo:'Gasto',descripcion:`Nómina quincena — ${emp}`,monto:total,forma_pago:pago||'Efectivo'}),
  ]);
  toast('Pago registrado ✓');goTo('nomina');
}
async function delNomina(id){if(!confirm('¿Eliminar?'))return;await dbDel('nomina',`?id=eq.${id}`);toast('Eliminado');goTo('nomina');}

/* ══ CIERRES DE MES ══ */

  ${cierres.length===0?`<div class="card" style="text-align:center;color:#bbb;padding:3rem">
    <i class="ti ti-calendar-off" style="font-size:40px;display:block;margin-bottom:8px"></i>
    Sin cierres registrados aún.<br><span style="font-size:12px">Al cerrar el mes desde Ajustes aparecerá aquí el resumen.</span>
  </div>`:

    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">

        <div style="font-weight:700;font-size:16px;text-transform:capitalize">${c.mes}</div>
        <div style="font-size:12px;color:#aaa">Cerrado el ${c.fecha}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:#aaa">Utilidad neta</div>

        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px">

        <div style="font-size:10px;color:#aaa;margin-bottom:3px">VENTAS</div>
        <div style="font-weight:700;color:#1F5014">${fmt(c.total_ventas)}</div>
        <div style="font-size:11px;color:#aaa">${c.total_pares} pares</div>
      </div>
      <div style="background:#F5F4F2;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:#aaa;margin-bottom:3px">UTILIDAD BRUTA</div>
        <div style="font-weight:700;color:#0C447C">${fmt(c.utilidad_bruta)}</div>
      </div>
      <div style="background:#F5F4F2;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:#aaa;margin-bottom:3px">GASTOS</div>
        <div style="font-weight:700;color:var(--red)">${fmt(c.total_gastos)}</div>
      </div>
      <div style="background:#F5F4F2;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:#aaa;margin-bottom:3px">COMISIONES</div>
        <div style="font-weight:700;color:#0C447C">${fmt(c.total_comisiones)}</div>
      </div>
    </div>
    <div style="background:${(c.utilidad_neta||0)>=0?'#EAF5E3':'#FDECEA'};border-radius:8px;padding:10px;font-size:13px;font-weight:600;text-align:center;color:${(c.utilidad_neta||0)>=0?'#1F5014':'#9B1512'}">
      ${(c.utilidad_neta||0)>=0?'✓ Mes rentable':'⚠ Mes con pérdida'} · Margen ${c.total_ventas>0?((c.utilidad_neta/c.total_ventas)*100).toFixed(1):0}%
    </div>
    ${isAdmin()?`<div style="text-align:right;margin-top:8px"><button class="btn btn-sm" onclick="delCierre(${c.id})" style="color:var(--red);border-color:#F5BABA;padding:4px 7px"><i class="ti ti-trash"></i></button></div>`:''}

}
async function delCierre(id){if(!confirm('¿Eliminar este cierre?'))return;await dbDel('cierres_mes',`?id=eq.${id}`);toast('Eliminado');goTo('cierres');}

render();
</script>
